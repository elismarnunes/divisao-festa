<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Divisão de Gastos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020617">

<link rel="manifest" href="manifest.json">

<style>
:root{
 --bg:#020617;
 --card:#020617;
 --text:#e5e7eb;
 --muted:#94a3b8;
 --primary:#38bdf8;
 --danger:#ef4444;
 --border:#1e293b;
 --soft:#0f172a;
}

body.light{
 --bg:#f1f5f9;
 --card:#ffffff;
 --text:#020617;
 --muted:#475569;
 --primary:#2563eb;
 --danger:#dc2626;
 --border:#e2e8f0;
 --soft:#f8fafc;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu;
 background:var(--bg);
 color:var(--text);
 display:flex;
 justify-content:center;
 padding:14px;
}

.card{
 width:100%;
 max-width:520px;
 background:var(--card);
 border-radius:26px;
 padding:16px;
 box-shadow:0 12px 30px rgba(0,0,0,.25);
 animation:fade .4s ease;
}

@keyframes fade{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:none}
}

.hidden{display:none}

h2{
 margin:4px 0 10px;
 text-align:center;
 font-weight:700;
 letter-spacing:.4px;
}

button{
 width:100%;
 padding:14px;
 border-radius:18px;
 border:none;
 background:linear-gradient(135deg,var(--primary),#1d4ed8);
 color:#fff;
 font-weight:600;
 margin-top:10px;
 transition:.15s;
}

button:active{transform:scale(.97)}

.danger{
 background:linear-gradient(135deg,#ef4444,#020712); 
}

.x-preto{
 color:#000;
}

.x-preto{
 color:#000;
 font-weight:900;
 font-size:18px;
 line-height:1;
}

input{
 width:100%;
 padding:12px;
 border-radius:14px;
 border:1px solid var(--border);
 margin-top:6px;
 background:var(--soft);
 color:var(--text);
 font-size:15px;
}

#infoFesta{
 background:linear-gradient(135deg,#0f172a,#020617);
 border:1px solid var(--border);
 border-radius:18px;
 padding:14px;
 margin-top:14px;
 text-align:center;
}

body.light #infoFesta{
 background:linear-gradient(135deg,#f8fafc,#ffffff);
}

.grupo{
 background:var(--soft);
 border-radius:18px;
 padding:12px;
 margin-top:12px;
 border:1px solid var(--border);
}

.linha{
 display:grid;
 grid-template-columns: 1fr 70px 70px 44px;
 gap:12px;
 align-items:end;
}

.footer{
 margin-top:16px;
 border-top:1px solid var(--border);
 padding-top:12px;
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:10px;
}

.creditos{
 margin-top:12px;
 text-align:center;
 font-size:12px;
 color:var(--muted);
}

.resultado{
 background:var(--soft);
 border-radius:18px;
 padding:14px;
 border:1px solid var(--border);
 margin-top:14px;
 white-space:pre-line;
 font-size:14px;
}

.historicoItem{
 background:var(--soft);
 padding:12px;
 border-radius:16px;
 border:1px solid var(--border);
 margin-bottom:10px;
}

#qrcode{
 display:flex;
 justify-content:center;
 margin-top:12px;
}

label{
 font-size:12px;
 color:var(--muted);
 font-weight:600;
}

input[type="checkbox"]{
 transform:scale(1.3);
 margin: 10px auto 0;
 display:block;
 cursor:pointer;
}

.col-meia{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:flex-end;
}

</style>

</head>

<body>

<div class="card" id="app">
<h2 style="text-align:center;font-weight:700;letter-spacing:.3px"> 🍾 Divisão de Gastos</h2>
<button onclick="novaFesta()">➕ Nova Festa</button>

<div id="infoFesta" class="hidden">
 <b id="nomeFesta"></b><br>
 <span id="valorFesta"></span>
</div>

<div id="grupos"></div>

<button onclick="addGrupo()">➕ Adicionar grupo</button>
<button onclick="calcular()">🧮 Calcular</button>
<button onclick="limparTela()">🧹 Limpar Tela</button>

<div id="resultado" class="resultado hidden"></div>

<div class="footer">
 <button onclick="abrirQR()">🔳 QR Code</button>
 <button onclick="abrirHistorico()">📚 Histórico</button>
 <button onclick="toggleTema()">🌗 Tema</button>
</div>



<div class="creditos">
 © <span id="ano"></span> — Desenvolvido por <b>Elismar Nunes de Paula</b>
</div>

</div>

<div class="card hidden" id="telaQR" style="text-align:center">
 <button onclick="voltar()">⬅ Voltar</button>
 <h3>QR Code</h3>
 <div id="qrcode"></div>
</div>

<div class="card hidden" id="telaHistorico">
 <button onclick="voltar()">⬅ Voltar</button>
 <h3>Histórico</h3>
 <div id="listaHistorico"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
document.getElementById('ano').innerText = new Date().getFullYear();

const SITE = location.origin + location.pathname;
const KEY='historico_festas';
let festaAtual=null;

function novaFesta(){
 const nome=prompt('Nome da festa:');
 if(!nome) return;
 let valor=prompt('Valor total:');
 if(!valor) return;
 valor=valor.replace(',','.');
 if(isNaN(valor)) return alert('Valor inválido');

 festaAtual={nome:nome.toUpperCase(),valor:parseFloat(valor)};
 nomeFesta.innerText=festaAtual.nome;
 valorFesta.innerText='💰 R$ '+festaAtual.valor.toFixed(2);
 infoFesta.classList.remove('hidden');
 grupos.innerHTML='';
 resultado.classList.add('hidden');
 addGrupo();
}

function addGrupo(){
 const d=document.createElement('div');
 d.className='grupo';
 d.innerHTML=`
 <div class="linha">
  <div>
   <label>Qtd</label>
   <input type="number" class="qtd" min="1" value="1">
  </div>

  <div class="col-meia">
   <label>Pg ½</label><br>
   <input type="checkbox" class="meia">
  </div>

  <div>
   <label>Dias</label>
   <input type="number" class="dias" min="1" value="1">
  </div>

  <button class="danger" onclick="this.closest('.grupo').remove()">
    <span class="x-preto">X</span>
  </button>

 </div>`;
 grupos.appendChild(d);
}

function calcular(){
 const cards=[...document.querySelectorAll('.grupo')];
 let unidades=0;

 cards.forEach(c=>{
  const qtd=+c.querySelector('.qtd').value;
  const dias=+c.querySelector('.dias').value;
  const meia=c.querySelector('.meia').checked?0.5:1;
  unidades+=qtd*dias*meia;
 });

 const valorUnidade=festaAtual.valor/unidades;
 let res='';

 cards.forEach((c,i)=>{
  const qtd=+c.querySelector('.qtd').value;
  const dias=+c.querySelector('.dias').value;
  const meia=c.querySelector('.meia').checked?0.5:1;

  let valor=(dias*meia*valorUnidade);
  const tipo = meia === 0.5 ? '½' : 'inteira';
	res+=`Grupo ${i+1}: ${qtd} pessoas (${tipo}) → R$ ${valor.toFixed(2)} cada\n`;
 });

 resultado.textContent=res;
 resultado.classList.remove('hidden');
 salvarHistorico();
}

function abrirQR(){
  const box=document.getElementById('qrcode');
  box.innerHTML='';
  new QRCode(box,{
    text: 'https://elismarnunes.github.io/divisao-festa/',
    width: 260,
    height: 260,
    colorDark: '#000000',
    colorLight: '#ffffff'
  });
  telaQR.classList.remove('hidden');
  app.classList.add('hidden');
}

function salvarHistorico(){
 const hist=JSON.parse(localStorage.getItem(KEY)||'[]');
 hist.unshift({data:new Date().toLocaleString(),festa:festaAtual,res:resultado.textContent});
 localStorage.setItem(KEY,JSON.stringify(hist));
}

function abrirHistorico(){
 app.classList.add('hidden');
 telaHistorico.classList.remove('hidden');
 carregarHistorico();
}

function carregarHistorico(){
 const hist=JSON.parse(localStorage.getItem(KEY)||'[]');
 listaHistorico.innerHTML='';
 hist.forEach((h,i)=>{
  const d=document.createElement('div');
  d.className='historicoItem';
  d.innerHTML=`<b>${h.festa.nome}</b><br>${h.res.replace(/\n/g,'<br>')}<button class="danger" onclick="excluir(${i})">Excluir</button>`;
  listaHistorico.appendChild(d);
 });
}

function excluir(i){
 const hist=JSON.parse(localStorage.getItem(KEY)||'[]');
 hist.splice(i,1);
 localStorage.setItem(KEY,JSON.stringify(hist));
 carregarHistorico();
}

function limparTela(){
 if(!confirm('Deseja realmente limpar a tela?')) return;

 festaAtual = null;
 infoFesta.classList.add('hidden');
 grupos.innerHTML = '';
 resultado.classList.add('hidden');
 resultado.textContent = '';
 document.getElementById('qrcode').innerHTML = '';

 addGrupo();
}

function toggleTema(){document.body.classList.toggle('light');}

function voltar(){telaQR.classList.add('hidden');telaHistorico.classList.add('hidden');app.classList.remove('hidden');}

if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
</script>

</body>
</html>
