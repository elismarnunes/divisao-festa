<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Divisão de Gastos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020617">

<style>
:root{
 --bg:#020617;--card:#020617;--text:#e5e7eb;--muted:#94a3b8;
 --primary:#38bdf8;--danger:#ef4444;--border:#334155;
}
body.light{
 --bg:#f1f5f9;--card:#fff;--text:#020617;--muted:#475569;
 --primary:#2563eb;--danger:#dc2626;--border:#cbd5e1;
}
body{
 margin:0;font-family:system-ui;background:var(--bg);color:var(--text);
 display:flex;justify-content:center;padding:14px;
}
.card{
 width:100%;max-width:520px;background:var(--card);
 border-radius:22px;padding:16px;
}
.hidden{display:none}

button{
 width:100%;padding:14px;border-radius:18px;border:none;
 background:var(--primary);color:#fff;font-weight:600;margin-top:10px;
}
.danger{background:var(--danger)}

input{
 width:100%;padding:12px;border-radius:14px;border:none;
 margin-top:6px;background:var(--bg);color:var(--text)
}

#infoFesta{
 background:linear-gradient(135deg,#0f172a,var(--bg));
 border:1px solid var(--border);border-radius:18px;padding:14px;
 margin-top:14px;text-align:center;
}

.grupo{
 background:var(--bg);border-radius:18px;padding:12px;
 margin-top:12px;border:1px solid var(--border)
}

.linha{
 display:grid;grid-template-columns:1fr 70px 70px 56px;
 gap:12px;align-items:end
}

.footer{
 margin-top:16px;border-top:1px solid var(--border);
 padding-top:12px;display:grid;
 grid-template-columns:1fr 1fr 1fr;gap:10px
}

.resultado{
 background:var(--bg);border-radius:18px;padding:14px;
 border:1px solid var(--border);margin-top:14px;
 white-space:pre-line;font-size:14px
}

.historicoItem{
 background:var(--bg);padding:12px;border-radius:14px;
 border:1px solid var(--border);margin-bottom:10px
}
</style>
</head>

<body>

<div class="card" id="app">

<h2 style="text-align:center">🍾 Divisão de Gastos</h2>

<button onclick="novaFesta()">➕ Nova Festa</button>

<div id="infoFesta" class="hidden">
 <b id="nomeFesta"></b><br>
 <span id="valorFesta"></span>
</div>

<div id="grupos"></div>

<button onclick="addGrupo()">➕ Adicionar grupo</button>
<button onclick="calcular()">🧮 Calcular</button>

<div id="resultado" class="resultado hidden"></div>

<div class="footer">
 <button onclick="abrirQR()">🔳 QR</button>
 <button onclick="abrirHistorico()">📚 Histórico</button>
 <button onclick="toggleTema()">🌗 Tema</button>
</div>

</div>

<div class="card hidden" id="telaQR">
 <button onclick="voltar()">⬅ Voltar</button>
 <h3>QR Code</h3>
 <canvas id="qrcode"></canvas>
</div>

<div class="card hidden" id="telaHistorico">
 <button onclick="voltar()">⬅ Voltar</button>
 <h3>Histórico</h3>
 <div id="listaHistorico"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
const KEY='historico_festas';
let festaAtual=null;
let ultimaDivisao=[];

function novaFesta(){
 const nome=prompt('Nome da festa:');
 if(!nome) return;
 let valor=prompt('Valor total:');
 if(!valor) return;
 valor=valor.replace(',','.');
 if(isNaN(valor)) return alert('Valor inválido');

 festaAtual={nome:nome.toUpperCase(),valor:parseFloat(valor)};
 nomeFesta.innerText=festaAtual.nome;
 valorFesta.innerText='💰 R$ '+festaAtual.valor.toFixed(2);
 infoFesta.classList.remove('hidden');
 grupos.innerHTML='';
 resultado.classList.add('hidden');
 addGrupo();
}

function addGrupo(){
 if(!festaAtual) return alert('Crie a festa primeiro');
 const d=document.createElement('div');
 d.className='grupo';
 d.innerHTML=`
 <div class="linha">
  <div><label>Qtd</label><input type="number" class="qtd" min="1" value="1"></div>
  <div><label>½</label><input type="checkbox" class="meia"></div>
  <div><label>Dias</label><input type="number" class="dias" min="1" value="1"></div>
  <button class="danger" onclick="this.closest('.grupo').remove()">❌</button>
 </div>`;
 grupos.appendChild(d);
}

function calcular(){
 const cards=[...document.querySelectorAll('.grupo')];
 let unidades=0;

 cards.forEach(c=>{
  const qtd=+c.querySelector('.qtd').value;
  const dias=+c.querySelector('.dias').value;
  const meia=c.querySelector('.meia').checked?0.5:1;
  unidades+=qtd*dias*meia;
 });

 const valorUnidade=festaAtual.valor/unidades;
 ultimaDivisao=[];
 let res='';

 cards.forEach((c,i)=>{
  const qtd=+c.querySelector('.qtd').value;
  const dias=+c.querySelector('.dias').value;
  const meia=c.querySelector('.meia').checked?0.5:1;

  let valor=(dias*meia*valorUnidade);
  ultimaDivisao.push({grupo:i+1,qtd,valorPessoa:valor});
  res+=`Grupo ${i+1}: ${qtd} pessoas → R$ ${valor.toFixed(2)} cada\n`;
 });

 resultado.textContent=res;
 resultado.classList.remove('hidden');
 salvarHistorico();
}

function salvarHistorico(){
 const hist=JSON.parse(localStorage.getItem(KEY)||'[]');
 hist.unshift({data:new Date().toLocaleString(),festa:festaAtual,res:resultado.textContent});
 localStorage.setItem(KEY,JSON.stringify(hist));
}

function abrirHistorico(){
 app.classList.add('hidden');
 telaHistorico.classList.remove('hidden');
 carregarHistorico();
}

function carregarHistorico(){
 const hist=JSON.parse(localStorage.getItem(KEY)||'[]');
 listaHistorico.innerHTML='';
 hist.forEach((h,i)=>{
  const d=document.createElement('div');
  d.className='historicoItem';
  d.innerHTML=`
   <b>${h.festa.nome}</b><br>
   ${h.res.replace(/\n/g,'<br>')}
   <button class="danger" onclick="excluir(${i})">Excluir</button>
  `;
  listaHistorico.appendChild(d);
 });
}

function excluir(i){
 const hist=JSON.parse(localStorage.getItem(KEY)||'[]');
 hist.splice(i,1);
 localStorage.setItem(KEY,JSON.stringify(hist));
 carregarHistorico();
}

function abrirQR(){
 app.classList.add('hidden');
 telaQR.classList.remove('hidden');
 QRCode.toCanvas(document.getElementById('qrcode'), location.href);
}

function toggleTema(){
 document.body.classList.toggle('light');
}

function voltar(){
 telaQR.classList.add('hidden');
 telaHistorico.classList.add('hidden');
 app.classList.remove('hidden');
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>
